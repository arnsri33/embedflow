<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EmbedFlow progressive migration architecture</title>
  <desc id="desc">A source model retrieves candidates from an existing index. A target model reranks cached candidates while a queue materializes missing target vectors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#172443"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#69a7ff"/><stop offset="1" stop-color="#b777ff"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#91a9d8"/></marker>
    <style>
      .box{fill:#141d35;stroke:#3e5485;stroke-width:2}.cache{fill:#1d2340;stroke:#b777ff;stroke-width:2}
      .label{font:600 18px system-ui,sans-serif;fill:#e8eefc}.small{font:14px system-ui,sans-serif;fill:#9fb0d8}
      .edge{stroke:#91a9d8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.accent{stroke:url(#accent);stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <text x="48" y="46" class="small" letter-spacing="3">EMBEDFLOW · PROGRESSIVE MIGRATION</text>
  <rect x="55" y="125" width="175" height="78" rx="12" class="box"/><text x="142" y="160" text-anchor="middle" class="label">Query</text><text x="142" y="184" text-anchor="middle" class="small">text input</text>
  <rect x="285" y="95" width="190" height="78" rx="12" class="box"/><text x="380" y="130" text-anchor="middle" class="label">Source model</text><text x="380" y="154" text-anchor="middle" class="small">encode + retrieve</text>
  <rect x="285" y="205" width="190" height="78" rx="12" class="box"/><text x="380" y="240" text-anchor="middle" class="label">Target model</text><text x="380" y="264" text-anchor="middle" class="small">query + document scores</text>
  <rect x="540" y="95" width="190" height="78" rx="12" class="box"/><text x="635" y="130" text-anchor="middle" class="label">Existing index</text><text x="635" y="154" text-anchor="middle" class="small">FAISS or Qdrant</text>
  <rect x="540" y="205" width="190" height="78" rx="12" class="cache"/><text x="635" y="240" text-anchor="middle" class="label">Target cache</text><text x="635" y="264" text-anchor="middle" class="small">persistent vectors</text>
  <rect x="795" y="95" width="170" height="78" rx="12" class="box"/><text x="880" y="130" text-anchor="middle" class="label">Rerank</text><text x="880" y="154" text-anchor="middle" class="small">available targets</text>
  <rect x="795" y="205" width="170" height="78" rx="12" class="cache"/><text x="880" y="240" text-anchor="middle" class="label">Materializer</text><text x="880" y="264" text-anchor="middle" class="small">bounded + queued</text>
  <rect x="1025" y="125" width="120" height="78" rx="12" class="box"/><text x="1085" y="160" text-anchor="middle" class="label">Serve</text><text x="1085" y="184" text-anchor="middle" class="small">API / UI</text>
  <path d="M230 164 L285 135" class="edge"/><path d="M380 173 L380 205" class="accent"/><path d="M475 135 L540 135" class="edge"/><path d="M475 244 L540 244" class="accent"/><path d="M730 135 L795 135" class="edge"/><path d="M730 244 L795 244" class="accent"/><path d="M880 205 L730 260" class="accent"/><path d="M965 135 L1025 164" class="edge"/><path d="M965 244 L1025 180" class="accent"/>
  <text x="600" y="330" text-anchor="middle" class="small">The new model can serve while target vectors are progressively materialized.</text>
</svg>
