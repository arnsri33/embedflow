<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative candidate gap curve</title>
  <desc id="desc">Candidate gap decreases as source candidate depth increases in the bundled synthetic evaluation fixture.</desc>
  <rect width="760" height="440" rx="18" fill="#0b1020"/>
  <text x="58" y="48" fill="#e8eefc" font-family="system-ui,sans-serif" font-size="20" font-weight="650">Candidate gap G(K)</text>
  <text x="58" y="73" fill="#9fb0d8" font-family="system-ui,sans-serif" font-size="13">Illustrative bundled fixture · not a benchmark claim</text>
  <line x1="90" y1="350" x2="700" y2="350" stroke="#4e638e"/><line x1="90" y1="100" x2="90" y2="350" stroke="#4e638e"/>
  <g fill="#9fb0d8" font-family="system-ui,sans-serif" font-size="12"><text x="82" y="355" text-anchor="end">0.00</text><text x="82" y="273" text-anchor="end">0.03</text><text x="82" y="190" text-anchor="end">0.06</text><text x="82" y="108" text-anchor="end">0.09</text><text x="395" y="395" text-anchor="middle">source candidate depth K</text><text x="31" y="230" text-anchor="middle" transform="rotate(-90 31 230)">gap (smaller is better)</text></g>
  <g stroke="#293a62" stroke-dasharray="4 6"><line x1="90" y1="267" x2="700" y2="267"/><line x1="90" y1="183" x2="700" y2="183"/><line x1="90" y1="100" x2="700" y2="100"/></g>
  <polyline points="160,123 350,218 590,350" fill="none" stroke="#b777ff" stroke-width="4"/>
  <g fill="#d9c4ff" stroke="#0b1020" stroke-width="3"><circle cx="160" cy="123" r="7"/><circle cx="350" cy="218" r="7"/><circle cx="590" cy="350" r="7"/></g>
  <g fill="#e8eefc" font-family="system-ui,sans-serif" font-size="13"><text x="160" y="380" text-anchor="middle">K=2</text><text x="350" y="380" text-anchor="middle">K=4</text><text x="590" y="380" text-anchor="middle">K=8</text><text x="160" y="111" text-anchor="middle">0.082</text><text x="350" y="206" text-anchor="middle">0.048</text><text x="590" y="338" text-anchor="middle">0.000</text></g>
  <text x="700" y="421" text-anchor="end" fill="#9fb0d8" font-family="system-ui,sans-serif" font-size="11">G(K) = M_T − M_{T|S_K}</text>
</svg>
