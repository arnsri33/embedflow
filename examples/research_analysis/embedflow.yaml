source:
  model: embedflow/demo-source
  dimension: 64
target:
  model: embedflow/demo-target
  dimension: 64
index:
  backend: faiss
  path: ./legacy.index
  metric: cosine
documents:
  path: ./documents.jsonl
probe:
  queries: ./queries.jsonl
  k_values: [2, 4, 8]
  kmax: 10
migration:
  candidate_depth: auto
  kmax_probe: 10
cache:
  path: ./embedflow_cache
telemetry:
  latency_log: ./logs/latency.jsonl
state_path: ./embedflow_state.json
