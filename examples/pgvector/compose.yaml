services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: embedflow
      POSTGRES_USER: embedflow
      POSTGRES_PASSWORD: embedflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embedflow -d embedflow"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  pgvector-data:
